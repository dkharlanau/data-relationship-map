name: CI

on:
  push:
    paths-ignore:
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python relationship_map.py examples/customer-chain.json validate
      - run: python relationship_policy.py examples/customer-chain.json examples/identity-policy.json
      - run: python csv_adapter.py examples/csv/manifest.json --output /tmp/customer-model.json
      - run: python relationship_map.py /tmp/customer-model.json validate
      - run: python relationship_map.py /tmp/customer-model.json path AFS:4711 S4:10000345
      - run: python relationship_policy.py /tmp/customer-model.json examples/identity-policy.json
      - run: python relationship_diff.py examples/customer-chain.json examples/customer-chain-after.json
      - run: python examples/xlsx/make_sample.py examples/xlsx/customer_crosswalk.xlsx
      - run: python xlsx_adapter.py examples/xlsx/manifest.json --output /tmp/customer-xlsx-model.json
      - run: python relationship_map.py /tmp/customer-xlsx-model.json validate
      - run: python relationship_map.py /tmp/customer-xlsx-model.json path AFS:4711 S4:10000345
      - run: python relationship_policy.py /tmp/customer-xlsx-model.json examples/identity-policy.json
