name: Publish Product Page

on:
  push:
    branches: [main]
    paths: ["docs/product.html", "docs/agent-manifest.json", ".github/workflows/product-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage product site
        run: |
          mkdir -p _site/demo
          cp docs/product.html _site/index.html
          cp docs/agent-manifest.json _site/agent-manifest.json
          python relationship_handoff.py build examples/customer-chain.json \
            _site/demo/handoff \
            --policy examples/identity-policy.json \
            --focus AFS:4711 \
            --max-depth 2 \
            --observed-at 2026-08-25T10:00:00Z
          python relationship_handoff.py verify _site/demo/handoff
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Add consent-aware portfolio analytics
        run: node scripts/inject-portfolio-analytics.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
